# Gasteiz Click · el contenedor del correo
#
# Este fichero lo subes a Dokploy como una aplicación de tipo Compose.
# La web NO se declara aquí: Dokploy ya la construye con nixpacks.toml.
#
# En Dokploy, la pestaña Environment de esta aplicación lleva estas cuatro:
#   PROMO_PARA, EMAIL_USER, EMAIL_PASS, MEC_TOKEN
# No van aquí a propósito: un secreto en el repositorio hay que revocarlo.


services:
  promo-cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasteiz-promo-cron

    # Los logs se quedan arriba y se ven desde Dokploy. Sin esto, un cron que lleva
    # una semana sin publicar es un contenedor verde y nadie se entera.
    restart: unless-stopped

    environment:
      # Sin esto, un contenedor Node corre en UTC y "las nueve" serían las once en
      # horario de verano. Es el mismo error que tuvo PUSH_DIGEST_HOUR.
      TZ: Europe/Madrid

      # Para node:sqlite, que es experimental y lo necesita para arrancar.
      NODE_OPTIONS: --experimental-sqlite

      # La hora del envío. Cambiar aquí es cambiar el día, sin tocar código.
      CROM_PROMO_HORA: "9"
      CROM_PROMO_MINUTO: "0"

      # Dónde se dejan las imágenes. El correo las lleva dentro, así que perder
      # este volumen no rompe nada: el disco es la comodidad, el correo es el canal.
      PROMO_DESTINO: /app/data/promo

      # PROMO_PARA, EMAIL_USER, EMAIL_PASS y MEC_TOKEN van en el panel de Dokploy.

    volumes:
      - promo-datos:/app/data

volumes:
  promo-datos: