<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!--
    La marca reducida, en SVG plano.

    **Por qué existe este fichero.** La marca reducida vivía solo dentro de
    `app/components/LogoMarkReducido.tsx`, un componente JSX que usa
    `currentColor` y la variable de acento: el navegador puede heredar el tema,
    el sistema operativo no. La app móvil necesita la misma marca como fichero,
    porque no puede importar un componente de React ni un SVG suelto.

    Así que aquí está la **misma** marca reducida, con los colores escritos, y
    `scripts/generate-app-brand.mjs` saca de aquí el PNG que pinta la cabecera
    de la app. `__tests__/logo-marca.test.ts` comprueba que los dos ficheros
    dicen lo mismo: es el mismo patrón que ya vigila `brand-mark.svg` contra
    `LogoMark.tsx`.

    **Qué se quita y por qué.** A 24 px —el tamaño que la usa la cabecera— de
    las seis piezas solo sobreviven tres: la G, la txapela y el pincho. Las
    otras tres quedan en manchas de un píxel. Medido el 20 de octubre de 2026.

    **Y el pincho engorda, de 9 a 17.** A 24 px un grosor de 9 sobre un lienzo
    de 512 son 0,42 píxeles: no se ve. Los 17 son en las mismas unidades del
    mismo lienzo, así que engorda sin tocar la geometría.
  -->
  <g transform="translate(256, 256)">
    <!-- La G: cuenco circular con abertura a la derecha y travesaño, para que se
         lea como letra y no como un anillo roto. Es el mismo trazado que en la
         marca completa, y lo es a propósito: una G con otro radio es otra marca. -->
    <path
      d="M 85 -85 A 120 120 0 1 0 120 16 L 120 0 L 18 0 L 18 42 L 62 42 A 62 62 0 1 1 44 -44 L 85 -85 Z"
      fill="#dc2626"
    />

    <!-- El pincho cruza en diagonal por delante de la G, y va después del path de la
         letra porque el orden de dibujo es el orden de las capas.

         **Más gordo que en la marca completa, de 9 a 17.** A 24 px el de 9 son 0,42
         píxeles: se ve una raya pálida o no se ve nada. Los 17 son justo lo que hace
         que la diagonal se lea, que es lo que hace que esta marca se distinga de
         una G roja con un gorro negro encima. -->
    <line
      x1="-126"
      y1="102"
      x2="107"
      y2="-130"
      stroke="#ca8a04"
      stroke-width="17"
      stroke-linecap="round"
    />

    <!-- La txapela, con el tallo del txuntxurro que la hace boina y no sombrero.
         Es la única pieza que sobrevive intacta: es una masa negra maciza, y a 24 px
         una masa maciza se lee igual que a 96. -->
    <g transform="translate(-38, -120) rotate(-16)">
      <path d="M 0 -22 L 0 -11" stroke="#18181b" stroke-width="11" stroke-linecap="round" />
      <path
        d="M -68 6 C -62 -22, 58 -28, 80 -2 C 84 14, -26 25, -68 6 Z"
        fill="#18181b"
      />
      <path
        d="M -54 8 C -20 20, 44 15, 66 5 C 46 13, -14 15, -54 8 Z"
        fill="#18181b"
        opacity="0.6"
      />
    </g>
  </g>
</svg>
