            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Evento"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceMisconfigured"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/actividades:
    get:
      tags: [events]
      summary: Actividades del calendario municipal
      operationId: getActividades
      responses:
        "200":
          description: >-
            Lista de actividades municipales. `data: []` **sí** significa que el
            calendario no traía actividades: el origen respondió.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: >-
            El calendario municipal no se pudo leer. Es un fallo del origen de datos
            o de esta ruta, no de la petición, y no se arregla cambiando parámetros.
            Antes devolvía `200 {count: 0, data: []}` para siempre —leía una clave
            que la respuesta del Ayuntamiento no tiene— y eso era indistinguible de
            "no hay actividades", con la app móvil cacheando un vacío permanente
            sin ningún error en ninguna parte.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error al consultar eventos"
        "503":
          $ref: "#/components/responses/ServiceMisconfigured"

