openapi: 3.1.0
info:
  title: Gasteiz Click API
  description: |
    API pública de Gasteiz Click — agregador de eventos culturales de Vitoria-Gasteiz.

    ## Autenticación
    La mayoría de endpoints requieren una API key enviada via:
    - Header: `x-api-key: TU_API_KEY`
    - Query param: `?api_key=TU_API_KEY`

    Las rutas marcadas con `security: []` no la requieren. Son las que consume la
    propia web desde el navegador (que no puede mandar la clave), los enlaces del
    newsletter, que llegan por correo, y las tres de cine, que se publican para
    clientes móviles. La lista está en `lib/api-public-routes.ts` y
    `__tests__/openapi.test.ts` la contrasta con este documento para que no
    puedan divergir.

    ## Rate Limiting
    - 100 peticiones por minuto por IP
    - Headers de respuesta: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`
    - Si se excede el límite: HTTP 429 con `Retry-After`
    - El contador vive en memoria y solo corre en las rutas con API key

    ## Caché
    Las respuestas incluyen headers `Cache-Control`. Los clientes móviles deben respetarlos.
  version: 1.0.0
  contact:
    name: Gasteiz Click
    url: https://gasteizclick.javierpalacio.es

servers:
  - url: https://gasteizclick.javierpalacio.es
    description: Producción
  - url: http://localhost:3000
    description: Desarrollo

security:
  - apiKey: []

tags:
  - name: events
    description: Eventos agregados de todas las fuentes
  - name: sources
    description: Fuentes individuales
  - name: cinema
    description: Carteleras de cine
  - name: sports
    description: Deportes y carreras
  - name: newsletter
    description: Suscripción al newsletter

paths:
  /api/v1/salud:
    get:
      tags: [events]
      summary: Si el agregado que se sirve está completo
      security: []
      description: |
        Dice cuándo se construyó el agregado que hay en caché, cuántas de las 28 fuentes
        han respondido y cuáles no. Léelo **antes** de fiarte de un listado.

        Existe porque el agregador usa `Promise.allSettled`: si 13 de 28 scrapers caen, la
        agenda se sirve más corta con HTTP 200 y ningún error. Sin esta ruta, un cliente no
        tiene forma de distinguir "hoy hay 400 eventos" de "hoy solo han respondido 13
        fuentes", y un modelo de lenguaje te contestaría con la mitad de la agenda y con
        toda la confianza.

        Solo lee la caché de cinco minutos, así que no dispara scraping ni por muchas
        peticiones que se hagan a la vez.
      responses:
        "200":
          description: Estado del agregado en caché
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [scrapedAt, sourcesTotal, sourcesOk, sourcesFallidas, completa, fuentes]
                    properties:
                      scrapedAt:
                        type: string
                        format: date-time
                        description: Cuándo se construyó el agregado, no cuándo se leyó
                        example: "2026-10-04T08:12:31.004Z"
                      sourcesTotal:
                        type: integer
                        description: Cuántas fuentes hay en el registro
                        example: 28
                      sourcesOk:
                        type: integer
                        description: Cuántas han respondido, aunque sea con lista vacía
                        example: 27
                      completa:
                        type: boolean
                        description: Si no ha caído ninguna fuente
                        example: false
                      sourcesFallidas:
                        type: array
                        description: Las fuentes que no han respondido, con el motivo
                        items:
                          type: object
                          required: [id, error]
                          properties:
                            id:
                              type: string
                              example: rula
                            error:
                              type: string
                              example: "la Genterula returned 500"
                      fuentes:
                        type: array
                        description: Todas las fuentes del registro, Responde o no
                        items:
                          type: object
                          required: [id, label]
                          properties:
                            id:
                              type: string
                              example: municipal-teatros
                            label:
                              type: string
                              example: Ayuntamiento
                            group:
                              type: string
                              example: municipal
        "503":
          description: La agenda no está disponible en este momento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable"

  /api/v1/events:
    get:
      tags: [events]
      summary: Eventos agregados (recomendado para móvil)
      description: |
        Endpoint principal para consumo desde apps móviles. Agrega eventos de todas las fuentes,
        elimina duplicados, y soporta filtros y paginación.
      operationId: getEvents
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [Música, Teatro, Cine, Exposiciones, Infantil, Deporte, Danza, Festival, Conferencias, Fiestas, Visitas, Talleres, Gastronomía, Senderismo, Otros]
          description: >-
            Filtrar por categoría. La comparación es por subcadena en minúsculas, así que
            también entran valores parciales; el enum lista las quince categorías
            canónicas que emite la agenda.
          example: Música
        - name: source
          in: query
          schema:
            type: string
            enum: [municipal-agenda, municipal-teatro, municipal-teatros, municipal-conciertos, municipal-exposiciones, municipal-general, municipal-deporte, municipal-charlas, municipal-talleres, municipal-danza, municipal-cine, municipal-fiestas, municipal-concursos, municipal-infantil, municipal-visitas, municipal-rss, vam, vam-conciertos, euskadi, senderismo, fiestas-blanca, jimmyjazz, helldorado, musikaze, fever, rula, gasteizhoy, eventbrite, entradium, vital, arkabia, mercado-abastos, miniature, buscametas-calendario, buscametas-inscripciones]
          description: >-
            Filtrar por fuente. Los valores son los ids del registro de fuentes de la
            agenda agregada, no nombres de sala. La comparación es exacta y en minúsculas.
          example: fever
        - name: search
          in: query
          schema:
            type: string
          description: Buscar por título, ubicación o descripción
          example: jazz
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Fecha de inicio (ISO YYYY-MM-DD)
          example: "2026-07-14"
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Fecha de fin (ISO YYYY-MM-DD)
          example: "2026-07-20"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: >-
            Número máximo de resultados. Un valor que no sea un entero —`?limit=all`,
            que es como el cliente móvil pide "dame todo"— **cae al valor por defecto
            (50)**, y uno numérico fuera de rango se recorta a 1..200. Ninguno de los
            dos casos es un error: la respuesta es correcta igual en ambos, así que no
            hay nada que el cliente pueda corregir y por eso no hay 400.
          example: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >-
            Offset para paginación. Sin tope superior, a propósito: recortarlo dejaría
            al cliente en un bucle de páginas vacías al final de un listado largo. Un
            valor no numérico cae al 0, y `meta.limit` y `meta.offset` siempre salen
            como números.
          example: 0
      responses:
        "200":
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Evento"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                data:
                  - id: "abc-123"
                    title: "Jazz en la Plaza"
                    date: "2026-07-15T20:00:00.000Z"
                    image: "https://example.com/img.jpg"
                    location: "Plaza España, Vitoria-Gasteiz"
                    link: "https://feverup.com/event/123"
                    category: "Música"
                    source: "fever"
                    time: "20:00"
                    description: "Noche de jazz en la plaza principal"
                meta:
                  total: 120
                  limit: 50
                  offset: 0
                  hasMore: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ScraperFailed"
        "503":
          $ref: "#/components/responses/ServiceMisconfigured"

