        "500":
          description: >-
            Falló el scraper. En la práctica casi siempre es una de dos cosas:
            falta `MEC_TOKEN` en el entorno del despliegue, o la API de La
            Genterula no responde. Las dos son de este servidor, no de quien llama:
            reintentar con otra clave no lo cambia y hay que mirar el despliegue.
            Documentar el 500 y no un `200` con la lista vacía es a propósito —
            antes la ausencia de token se cacheaba y salía como `200 {count: 0}`—,
            porque "no lo sé" y "no hay eventos" tienen que poder distinguirse. Y
            `data` vacío **sí** significa que no hay eventos: el origen respondió y
            no traía ninguno.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error al consultar eventos de La Gente Rula"
        "503":
          $ref: "#/components/responses/ServiceMisconfigured"

  /api/gasteizhoy:
    get:
      tags: [sources]
      summary: Eventos de GasteizHoy
      operationId: getGasteizHoy
      responses:
        "200":
          description: Eventos de GasteizHoy
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GasteizHoyEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceMisconfigured"

  /api/vam:
    get:
      tags: [sources]
      summary: Eventos de VAM Cultura
      operationId: getVam
      responses:
        "200":
          description: Eventos de VAM Cultura
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VamEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceMisconfigured"

  /api/cines:
    get:
      tags: [cinema]
      summary: Cartelera combinada (Cine Florida + Yelmo Cines Boulevard)
      operationId: getCines
      security: []
      responses:
        "200":
          description: >-
            Películas de ambos cines, cada una etiquetada con su cine. Si uno de
            los dos falló, `cinesConError` dice cuál y `peliculas` trae las del
            otro. Si ninguno falló, `cinesConError` no está.
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: array
                    description: Las dos fuentes que alimentan la cartelera
                    items:
                      type: string
                  scrapedAt:
                    type: string
                    format: date-time
                  total:
                    type: integer
                  cinesConError:
                    type: array
                    description: Cines cuyo scraping falló. Ausente si no falló ninguno
                    items:
                      type: string
                      enum: [Florida, Boulevard]
                  peliculas:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Pelicula"
                        - type: object
                          properties:
                            cine:
                              type: string
                              enum: [Florida, Boulevard]
        "502":
          description: >-
            Ninguno de los dos cines respondió. Un 200 con `peliculas: []`
            significa que el cine respondió y no tenía cartelera, que es otro
            cosa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  cinesConError:
                    type: array
                    items:
                      type: string
                      enum: [Florida, Boulevard]

  /api/cines/boulevard:
    get:
      tags: [cinema]
      summary: Cartelera de Yelmo Cines Boulevard
      operationId: getBoulevard
      security: []
      responses:
        "200":
          description: >-
            Películas en cartelera. `duracion` va siempre vacía: Sensacine no
            la publica en la página del cine.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  scrapedAt:
                    type: string
                    format: date-time
                  total:
                    type: integer
                  peliculas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pelicula"
        "502":
          description: La fuente no respondió
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/cines/florida:
    get:
      tags: [cinema]
      summary: Cartelera de Cine Florida
      operationId: getFlorida
      security: []
      responses:
        "200":
          description: Películas en cartelera, con su duración
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  scrapedAt:
                    type: string
                    format: date-time
                  total:
                    type: integer
                  peliculas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pelicula"
        "502":
          description: La fuente no respondió
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/farmacias:
    get:
      tags: [sources]
      summary: Farmacias de Vitoria
      operationId: getFarmacias
      security: []
      responses:
        "200":
          description: >-
            Farmacias del directorio abierto del Gobierno Vasco. **No es el cuadrante
            de guardia**: la fuente de guardia es inaccesible y lo que se sirve es un
            directorio, así que los campos de turno y horario salen vacíos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    description: >-
                      De dónde sale el dato. `opendata-euskadi` desde que Cofalava dejó
                      de responder; el nombre anterior, `cofalava`, ya no se emite.
                    example: "opendata-euskadi"
                  date:
                    type: string
                    description: >-
                      Día al que corresponde el cuadrante, o cadena vacía si el
                      directorio no publica ninguno.
                  count:
                    type: integer
                    description: Cuántas farmacias trae `data`.
                  fetchedAt:
                    type: integer
                    format: int64
                    description: Instante de la descarga, en milisegundos epoch.
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Farmacia"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /api/newsletter/subscribe:
    post:
      tags: [newsletter]
      summary: Suscribirse al newsletter
      operationId: subscribe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Suscripción registrada
        "400":
          description: Email inválido
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ScraperFailed"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /api/newsletter/confirm:
    get:
      tags: [newsletter]
      summary: Confirmar suscripción
      operationId: confirmSubscription
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "307":
          description: >-
            Redirección a la portada. El destino dice si el enlace valió:
            `?newsletter=confirmed` con un token correcto, `?newsletter=invalid-token`
            con uno que no corresponde a nadie o con una suscripción que se dio
            de baja, y `?newsletter=error` si no vino token.
          headers:
            Location:
              schema:
                type: string
                example: "/?newsletter=confirmed"

  /api/newsletter/unsubscribe:
    get:
      tags: [newsletter]
      summary: Cancelar suscripción
      operationId: unsubscribe
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "307":
          description: >-
            Redirección a la portada. `?newsletter=unsubscribed` si la baja se
            aplicó, `?newsletter=error` si el token no corresponde a nadie.
          headers:
            Location:
              schema:
                type: string
                example: "/?newsletter=unsubscribed"
        "400":
          description: No venía el parámetro `token` en la query

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        API key para autenticar las rutas protegidas. También se puede enviar como query param `?api_key=`.

  schemas:
    Evento:
      type: object
      description: Evento cultural normalizado
      properties:
        id:
          type: string
          description: Identificador único del evento
        title:
          type: string
          description: Título del evento
        date:
          type: string
          description: Fecha del evento (ISO 8601)
        image:
          type: string
          nullable: true
          description: URL de la imagen del evento
        location:
          type: string
          description: Ubicación del evento
        link:
          type: string
          description: URL original del evento
        category:
          type: string
          description: Categoría del evento
        source:
          type: string
          description: >-
            Fuente de datos. Los valores son los ids del registro de fuentes, no nombres
            de sala ni de sede; el enum del parámetro `source` de `/api/v1/events` los
            lista todos.
        time:
          type: string
          description: Hora del evento
        description:
          type: string
          description: Descripción del evento

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total de resultados que coinciden con los filtros
        limit:
          type: integer
          description: Límite de resultados por página
        offset:
          type: integer
          description: Offset actual
        hasMore:
          type: boolean
          description: Si hay más resultados disponibles

    FeverEvent:
      type: object
      properties:
        id:
          type: string
          example: fever-12345
        title:
          type: string
        date:
          type: string
        image:
          type: string
        location:
          type: string
        link:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [Música, Teatro, Cine, Exposiciones, Infantil, Deporte, Danza, Festival, Conferencias, Fiestas, Visitas, Talleres, Gastronomía, Senderismo, Otros]

    RulaEvent:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        image:
          type: string
        location:
          type: string
        link:
          type: string
        description:
          type: string
        category:
          type: string

    GasteizHoyEvent:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        date:
          type: string
        time:
          type: string
        image:
          type: string
        location:
          type: string
        link:
          type: string
        description:
          type: string
        category:
          type: string
        source:
          type: string
          example: gasteizhoy

    VamEvent:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        image:
          type: string
          nullable: true
        location:
          type: string
        link:
          type: string
        category:
          type: string
        source:
          type: string
          example: vam
        description:
          type: string
        time:
          type: string

    ActividadSenderismo:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        link:
          type: string
        image:
          type: string
        category:
          type: string
          example: excursiones
        location:
          type: string
          example: Gazteiz

    TourCivitatis:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        link:
          type: string
        image:
          type: string
        duration:
          type: string
          example: 1h 45m
        language:
          type: string
          example: Español
        price:
          type: string
          example: 5 €
        rating:
          type: number
          nullable: true
          description: Puntuación sobre 10, con punto decimal.
        reviews:
          type: integer
          nullable: true
        travelers:
          type: string
          example: 230.605 viajeros
        categories:
          type: string
          example: visitas-guiadas

    ExperienciaKora:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        image:
          type: string
        link:
          type: string
        reservation:
          type: string
          description: Enlace de reserva, normalmente a Eventbrite.
        schedule:
          type: string
          example: Martes de 19:15h a 20:15h
        price:
          type: string
        language:
          type: string
          example: Español e inglés

    Concierto:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
          description: 'Fecha legible (ej: "Viernes 18 Julio 2026")'
        location:
          type: string
        image:
          type: string
          nullable: true
        link:
          type: string

    Carrera:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        image:
          type: string
        location:
          type: string
        link:
          type: string

    Pelicula:
      type: object
      description: Película de Yelmo Cines Boulevard
      properties:
        titulo:
          type: string
        duracion:
          type: string
        genero:
          type: string
        imagen:
          type: string
        link:
          type: string
        horarios:
          type: array
          items:
            type: string
          description: 'Lista de horarios (ej: ["16:30", "19:00", "21:30"])'

    ArkabiaEvento:
      type: object
      description: Evento de Arkabia
      properties:
        title:
          type: string
        subtitle:
          type: string
        image:
          type: string
        link:
          type: string
        fecha:
          type: string
          description: 'Rango de fechas mostrado (ej: "04/06 - 13/10/2026")'
        precio:
          type: string
          description: Precio o "GRATIS"
        categoria:
          type: array
          items:
            type: string
        date:
          type: string
          format: date
          description: Fecha de inicio en ISO 8601

    EventoAgenda:
      type: object
      description: Evento normalizado procedente de la agenda agregada
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        date:
          type: string
        dateEnd:
          type: string
        time:
          type: string
        image:
          type: string
        location:
          type: string
        link:
          type: string
        description:
          type: string
        category:
          type: string
        source:
          type: string
        price:
          type: string
        rating:
          type: number

    Farmacia:
      type: object
      description: >-
        Una farmacia del directorio. Los nombres de campo son los que emite
        `lib/sources/farmacias.ts` y los que consumen el mapa, la página y la app
        móvil; antes el documento declaraba `nombre`/`direccion`/`ciudad`/`telefono`/
        `horario`, que no existen, así que un cliente generado desde aquí leía
        `undefined` en las cinco. Los tres últimos campos son cadenas y no números a
        propósito: es lo que hacía el scraper anterior y lo que el mapa consume con
        `Number(f.lat)`.
      properties:
        id:
          type: string
          description: >-
            Identificador en el registro sanitario (`idif`). Antes era el id del
            marcador del mapa, que ya no existe; sin id único el mapa y la lista no
            tienen clave estable.
        name:
          type: string
          description: >-
            Nombre del titular. Una de las de Vitoria no lo publica y sale como
            "Farmacia (nombre no publicado)" en vez de desaparecer de la lista.
        address:
          type: string
          description: 'Dirección completa: calle, código postal y municipio.'
        shortAddress:
          type: string
          description: Solo la calle, sin código postal ni municipio.
        phone:
          type: string
        date:
          type: string
          description: >-
            Vacía siempre. El directorio es un **directorio**, no un cuadrante de
            guardia: no publica turno ni fecha, y no se inventa ninguno.
        horarios:
          type: string
          description: Vacía siempre, por lo mismo que `date`.
        neighborhood:
          type: string
          description: Vacía siempre, por lo mismo que `date`.
        city:
          type: string
        zone:
          type: string
          description: Vacía siempre, por lo mismo que `date`.
        lat:
          type: string
          description: Latitud en grados, como cadena.
        lng:
          type: string
          description: Longitud en grados, como cadena.

  responses:
    UpstreamUnavailable:
      description: >-
        El origen de datos que tiene delante no respondió, o respondió con un error.
        No es un problema de quien llama —la petición es válida— y reintentar dentro
        de un rato sí recupera, porque el estado del servidor no ha cambiado. Un
        `200` con la lista vacía significaría "no hay nada", que es otra cosa: un
        origen que responde bien y no tiene datos **es** un dato, y por eso sale con
        `200`. Es el mismo código que usa `/api/cines` para lo mismo.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "No se pudieron obtener las farmacias de Vitoria"

    ScraperFailed:
      description: >-
        El scraper de esta ruta falló. Es un fallo de este servidor, no de la
        petición: reintentar con otra clave o con otros parámetros no lo cambia.
        Sirve para las rutas cuyo scraper propaga el error en vez de devolver una
        lista vacía, porque un `200 {count: 0}` que en realidad significa "no lo sé"
        es lo que cachea un cliente móvil como si fuera un resultado.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Error al consultar eventos"

    ServiceMisconfigured:
      description: >-
        El servidor no tiene `API_KEY` en el entorno, así que el middleware
        cierra las rutas protegidas en vez de abrirlas. No es un problema de
        quien llama: reintentar con otra clave no va a cambiar nada, hay que
        configurar el despliegue. Un 401 significaría que la clave no es válida; este 503 significa que aquí no hay ninguna.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Service misconfigured - API_KEY is not set on the server, so protected endpoints are closed"

    Unauthorized:
      description: API key no proporcionada o inválida
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized – provide a valid x-api-key header or ?api_key= query param"

    RateLimited:
      description: Límite de peticiones excedido
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos hasta poder hacer otra petición
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Rate limit exceeded. Try again later."
