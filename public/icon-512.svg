<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    El icono del PWA, el que el escritorio recorta en cuadrado.

    Es el mismo dibujo que `public/brand-mark.svg` y que
    `app/components/LogoMark.tsx`, con dos diferencias que son del formato y no
    del diseño: las esquinas redondeadas (`rx`) y una marca más pequeña dentro,
    porque el sistema aplica su propia máscara encima y recorta por los lados.

    La diferencia de tamaño con el maskable es medida, no elegida: aquí la marca
    ocupa el 87% del lienzo y en `icon-maskable.svg` el 72%, que es lo que deja
    el sistema al recortar en círculo. `__tests__/logo-marca.test.ts` comprueba
    que los tres ficheros llevan la misma marca.
  -->
  <rect width="512" height="512" rx="112" fill="#faf9f5"/>

  <g transform="translate(256 256) scale(0.87)">
    <!-- La G: cuenco circular con abertura a la derecha y travesaño. -->
    <path d="
      M 85 -85
      A 120 120 0 1 0 120 16
      L 120 0
      L 18 0
      L 18 42
      L 62 42
      A 62 62 0 1 1 44 -44
      L 85 -85
      Z"
      fill="#dc2626"
    />

    <!-- La nota, dentro de la curva de la G. -->
    <g transform="translate(-18, -48)">
      <ellipse cx="0" cy="14" rx="14" ry="10" transform="rotate(-26, 0, 14)" fill="#18181b"/>
      <rect x="7" y="-28" width="8" height="42" rx="4" fill="#18181b"/>
      <path d="M 15 -28 C 30 -28 36 -12 36 6 C 30 -4 23 -12 15 -14 Z" fill="#18181b"/>
    </g>

    <!-- El pincho, por delante de la G: va despues del path de la letra. -->
    <line x1="-135" y1="110" x2="115" y2="-140" stroke="#ca8a04" stroke-width="9" stroke-linecap="round"/>

    <!-- La gilda: aceituna con elcentro rojo del pimenton y guindillo. -->
    <g transform="translate(-24, 2)">
      <circle cx="0" cy="0" r="22" fill="#65a30d"/>
      <circle cx="0" cy="0" r="18" fill="#4d7c0f"/>
      <circle cx="0" cy="0" r="8" fill="#dc2626"/>
      <circle cx="-5" cy="-5" r="3.5" fill="#faf9f5"/>
    </g>

    <path d="M -60 14 C -42 -22, 10 -28, 48 -6 C 22 18, -26 24, -60 14 Z" fill="#4d7c0f"/>
    <path d="M -48 6 C -34 -14, 4 -18, 36 -2 C 18 10, -20 14, -48 6 Z" fill="#65a30d"/>
    <path d="M -60 14 C -72 12, -80 6, -84 -4 C -80 2, -72 8, -64 12 Z" fill="#365314"/>

    <!-- La txapela, con su txuntxurro. -->
    <g transform="translate(-38, -120) rotate(-16)">
      <path d="M 0 -22 L 0 -11" stroke="#18181b" stroke-width="5" stroke-linecap="round"/>
      <path d="
        M -68 6
        C -62 -22, 58 -28, 80 -2
        C 84 14, -26 25, -68 6
        Z"
        fill="#18181b"
      />
      <path d="
        M -54 8
        C -20 20, 44 15, 66 5
        C 46 13, -14 15, -54 8
        Z"
        fill="#27272a"
      />
    </g>

    <!-- El cursor y sus ondas. El contorno crema lo separa de la G. -->
    <g transform="translate(108, 18)">
      <path d="M -14 -22 A 26 26 0 0 1 -14 22" fill="none" stroke="#dc2626" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M -4 -34 A 40 40 0 0 1 -4 34" fill="none" stroke="#dc2626" stroke-width="5.5" stroke-linecap="round"/>
      <path d="
        M 10 -16
        L 40 28
        L 24 29
        L 34 50
        L 23 55
        L 13 34
        L 1 42
        Z"
        fill="#18181b"
        stroke="#faf9f5"
        stroke-width="5"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>